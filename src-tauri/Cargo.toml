[package]
name = "karakeep-transfer"
version = "0.1.0"
description = "Transfer bookmarks to Karakeep from a private desktop app"
authors = ["Rupert Germann"]
edition = "2024"
license = "MIT"

[lib]
name = "karakeep_transfer_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
html-escape = "0.2.13"
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
url = "2.5.8"

[dev-dependencies]
tauri = { version = "2.11.5", features = ["test"] }
tempfile = "3.27.0"
