name: Tests

on:
  pull_request:
  workflow_dispatch:
    inputs:
      check:
        description: Check to run
        type: choice
        default: icons
        options:
          - icons
          - windows-preflight
          - cold-rust

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  icons:
    if: github.event_name == 'workflow_dispatch' && inputs.check == 'icons'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m unittest -v tests.test_app_icons

  desktop:
    if: github.event_name == 'pull_request'
    # Release-script tests exercise macOS staging with native-host validation.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check repository privacy
        run: python3 -m unittest discover -s tests -p test_repository_privacy.py -v
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            fieldtheory-bridge/package-lock.json
      - run: npm ci
      - run: npm ci --prefix fieldtheory-bridge
      - run: npm test
      - run: npm run typecheck
      - run: npm run test:fieldtheory

  rust:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.check == 'cold-rust')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Tauri expects the resource directory even though these tests use fixture sidecars.
      - run: mkdir -p src-tauri/resources
      - name: Run Cargo tests
        if: github.event_name == 'pull_request'
        run: cargo +stable test --locked --manifest-path src-tauri/Cargo.toml
      - name: Time cold Cargo tests
        if: github.event_name == 'workflow_dispatch'
        env:
          CARGO_HOME: ${{ runner.temp }}/cold-rust-cargo
          CARGO_TARGET_DIR: ${{ runner.temp }}/cold-rust-target
        run: /usr/bin/time -p cargo +stable test --locked --manifest-path src-tauri/Cargo.toml

  windows-release-preflight:
    if: github.event_name == 'workflow_dispatch' && inputs.check == 'windows-preflight'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Select the pinned release toolchain
        shell: pwsh
        run: |
          $rust = (Get-Content release/release-inputs.json -Raw | ConvertFrom-Json).buildToolchains.rust
          rustup toolchain install $rust --profile minimal
          "RUSTUP_TOOLCHAIN=$rust" >> $env:GITHUB_ENV
      - run: npm ci --ignore-scripts
      - run: npm run prepare:fieldtheory
      - run: npx --no-install vite build
      - run: npm run release:inputs -- --target windows-x64
      - run: npm run release:build-candidate -- --input release-inputs/windows-x64 --dry-run
      - run: node --test scripts/test/build-release-candidate.test.mjs
