name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      cold_rust:
        description: Also measure a cold Rust test run on macOS
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.14"]
        exclude: >-
          ${{ fromJSON(github.event_name == 'pull_request'
            && '[{"os":"macos-latest"},{"os":"windows-latest","python-version":"3.10"}]'
            || '[]') }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONWARNINGS: error::ResourceWarning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q karakeep-import.py karakeep-import-gui.py tests

  desktop:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            fieldtheory-bridge/package-lock.json
      - run: npm ci
      - run: npm ci --prefix fieldtheory-bridge
      - run: npm test
      - run: npm run typecheck
      - run: npm run test:fieldtheory

  cold-rust:
    if: github.event_name == 'workflow_dispatch' && inputs.cold_rust
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Tauri expects the resource directory even though these tests use fixture sidecars.
      - run: mkdir -p src-tauri/resources
      - name: Time cold Cargo tests
        env:
          CARGO_HOME: ${{ runner.temp }}/cold-rust-cargo
          CARGO_TARGET_DIR: ${{ runner.temp }}/cold-rust-target
        run: /usr/bin/time -p cargo +stable test --locked --manifest-path src-tauri/Cargo.toml
